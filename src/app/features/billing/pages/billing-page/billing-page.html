<div class="row g-4">
  <!-- Left Column: Interactive Invoice Billing Editor -->
  <div class="col-xl-6">
    <div class="mb-2">
      <h2 class="h5 font-weight-bold mb-1 text-dark">Invoice Generator</h2>
      <p class="text-secondary small">Add products, configure quantities, and manage customer billing details.</p>
    </div>
    <app-invoice-form></app-invoice-form>
  </div>

  <!-- Right Column: Live Sticky A4 Print Preview -->
  <div class="col-xl-6 d-none d-xl-block">
    <div class="mb-2">
      <h2 class="h5 font-weight-bold mb-1 text-dark">Live A4 Paper Preview</h2>
      <p class="text-secondary small">Real-time print alignment, tax breakdown, and signature areas.</p>
    </div>
    <!-- Sticky positioning keeps the print preview in view while scrolling long item forms -->
    <div class="sticky-xl-top" style="top: 20px; z-index: 100;">
      <app-invoice-preview></app-invoice-preview>
    </div>
  </div>

  <!-- Mobile/Tablet Fallback Preview Drawer (Visible at the bottom on smaller viewports) -->
  <div class="col-12 d-xl-none mt-5">
    <hr class="my-4">
    <div class="mb-3">
      <h2 class="h5 font-weight-bold mb-1 text-dark">A4 Paper Preview</h2>
      <p class="text-secondary small">Live view of the compiled accounting taxonomy.</p>
    </div>
    <app-invoice-preview></app-invoice-preview>
  </div>
</div>
