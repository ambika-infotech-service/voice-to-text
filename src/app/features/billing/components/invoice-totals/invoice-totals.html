<div class="card bg-light border border-light-subtle shadow-sm">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary small">Subtotal:</span>
            <span class="text-dark font-weight-bold">₹{{ invoice().subtotal | number:'1.2-2' }}</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary small">Discount Amount:</span>
            <span class="text-danger">(-) ₹{{ invoice().discount | number:'1.2-2' }}</span>
        </div>
        <!--
        <div class="d-flex justify-content-between mb-2 border-top pt-1">
            <span class="text-secondary small">Taxable Value:</span>
            <span class="text-dark font-weight-bold">₹{{ invoice().taxableAmount | number:'1.2-2' }}</span>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-secondary small">GST (Standard 18%):</span>
            <span class="text-dark">₹{{ invoice().gst | number:'1.2-2' }}</span>
        </div>
        -->
        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
            <span class="text-secondary small">Round Off Adjustment:</span>
            <span class="text-muted" [class.text-danger]="invoice().roundOff < 0">
                {{ invoice().roundOff >= 0 ? '(+)' : '' }} ₹{{ invoice().roundOff | number:'1.2-2' }}
            </span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="text-primary font-weight-bold">Grand Total:</span>
            <span class="h5 text-primary mb-0 font-weight-bold">₹{{ invoice().grandTotal | number:'1.0-0' }}</span>
        </div>
    </div>
</div>
