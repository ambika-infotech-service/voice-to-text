<td [formGroup]="itemGroup()" class="align-middle position-relative">
    <div class="input-group input-group-sm">
        <input type="text" class="form-control" formControlName="itemName" placeholder="Type or click mic to speak..."
            autocomplete="off" (input)="onSearchInput($event)" (focus)="onFocus()" (blur)="onBlur()">
        <button type="button" class="btn px-2" [class.btn-danger]="isCurrentlyListening()"
            [class.btn-outline-secondary]="!isCurrentlyListening()"
            [title]="isCurrentlyListening() ? 'Listening... Click to stop' : 'Search by Voice'"
            (click)="triggerMic.emit(); $event.stopPropagation()">
            @if (isCurrentlyListening()) {
            🎙️
            } @else {
            🎤
            }
        </button>
    </div>

    @if (showDropdown() && filteredProducts().length > 0) {
    <ul class="dropdown-menu show position-absolute w-100 shadow border-secondary-subtle overflow-y-auto"
        style="max-height: 180px; z-index: 1050; left: 0; top: 100%;">
        @for (prod of filteredProducts(); track prod.Id) {
        <li>
            <button type="button"
                class="dropdown-item small d-flex justify-content-between align-items-center py-1.5 px-3 border-bottom-0"
                (mousedown)="selectProduct(prod)">
                <span class="text-dark font-weight-bold">{{ prod.DisplayName }}</span>
                <span class="badge bg-light text-secondary border border-light-subtle">₹{{ prod.SellingPrice }}/{{
                    prod.Unit }}</span>
            </button>
        </li>
        }
    </ul>
    }
</td>
<td [formGroup]="itemGroup()" class="align-middle" style="width: 100px;">
    <input type="number" class="form-control form-control-sm text-end" formControlName="quantity" placeholder="Qty">
</td>
<td [formGroup]="itemGroup()" class="align-middle" style="width: 90px;">
    <input type="text" class="form-control form-control-sm" formControlName="unit" placeholder="e.g. Mtr">
</td>
<td [formGroup]="itemGroup()" class="align-middle" style="width: 120px;">
    <div class="input-group input-group-sm">
        <span class="input-group-text bg-light text-muted small">₹</span>
        <input type="number" class="form-control text-end" formControlName="rate" placeholder="0.00">
    </div>
</td>
<td class="text-end align-middle font-weight-bold text-dark px-3" style="width: 130px;">
    ₹{{ (itemGroup().get('amount')?.value ?? 0) | number:'1.2-2' }}
</td>
<td class="text-end align-middle" style="width: 60px;">
    <button type="button" class="btn btn-sm btn-outline-danger px-2 py-1" title="Delete Item" (click)="onDelete()">
        Delete
    </button>
</td>
